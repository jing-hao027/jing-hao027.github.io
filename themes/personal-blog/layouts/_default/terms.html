{{ define "main" }}
<div class="container">
  <div class="page-body prose" style="max-width:860px;">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    <div class="tag-cloud">
      {{- range .Data.Terms.ByCount }}
        <a class="tag" href="{{ .Page.RelPermalink }}">{{ .Page.Title }} ({{ .Count }})</a>
      {{- end }}
    </div>
  </div>
</div>
{{ end }}
