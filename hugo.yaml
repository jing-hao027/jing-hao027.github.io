# ============================================================
#  个人网站配置文件（改这里就能改网站基本信息）
# ============================================================

# 你的最终网址。绑定域名后改这里，例如 https://www.yourdomain.com/
baseURL: "https://jing-hao027.github.io/"

# 网站标题（显示在浏览器标签和页眉）
title: "我的个人网站"

# 语言：简体中文
defaultContentLanguage: "zh-cn"
locale: "zh-cn"

# 使用我们自带的主题
theme: "personal-blog"

# 生成的网页输出到 docs 文件夹（GitHub Pages 就发布这个文件夹，别改）
publishDir: "docs"

# 每页显示多少篇文章
pagination:
  pagerSize: 10

params:
  # 首页大标题和副标题（把 [你的名字] 换成你的名字或昵称）
  homeTitle: "你好，我是 jing-hao027"
  homeSubtitle: "记录作品、文章与生活的地方"
  # 页脚版权
  copyright: "© 2026 jing-hao027"
  # 侧边栏自我介绍
  bio: "这里写一段关于你自己的介绍，两三句话即可。比如：喜欢写代码、听音乐、偶尔拍点照片。"
  # 导航栏：name 是显示文字，url 是链接
  nav:
    - name: "首页"
      url: "/"
    - name: "文章"
      url: "/posts/"
    - name: "作品"
      url: "/works/"
    - name: "音乐"
      url: "/music/"
    - name: "照片"
      url: "/photos/"
    - name: "关于"
      url: "/about/"
    - name: "联系"
      url: "/contact/"

# 首页额外输出 RSS 订阅
outputs:
  home:
    - HTML
    - RSS

# Markdown 渲染选项
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: "github"
